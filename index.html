<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14532d">
<title>Handletur</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#f5f6f3; --card:#fff; --ink:#1b1f1c; --muted:#6b736d; --line:#e3e6e1;
  --green:#14532d; --green2:#1f7a44; --soft:#e8f3ec; --warn:#a15c00; --warnbg:#fff4e0; --red:#b42318;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#111412; --card:#1a1e1b; --ink:#e9ece9; --muted:#9aa39c; --line:#2b312d; --green:#4ade80; --green2:#22c55e; --soft:#1d2d22; --warn:#f0b354; --warnbg:#2e2412; --red:#f87171;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 12px) 16px 8px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:20px;margin:0;letter-spacing:-.01em}
.badge{font-size:12px;padding:3px 8px;border-radius:99px;background:var(--warnbg);color:var(--warn);font-weight:600}
main{padding:4px 12px calc(env(safe-area-inset-bottom) + 90px);max-width:640px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--muted);padding:10px 0 12px;font:600 12px system-ui;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--green)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.card h2{font-size:16px;margin:0 0 10px}
.card h3{font-size:14px;margin:12px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
input,select,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 11px;width:100%}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--green2);flex:none}
input.num{width:74px;text-align:center}
textarea{min-height:90px;font-size:13px;font-family:ui-monospace,monospace}
.btn{font:600 15px system-ui;border:0;border-radius:10px;padding:11px 14px;background:var(--green);color:#fff;cursor:pointer;white-space:nowrap}
@media (prefers-color-scheme: dark){.btn{color:#0b1a10}}
.btn.sec{background:var(--soft);color:var(--green)}
.btn.ghost{background:none;color:var(--muted);padding:8px}
.btn.big{width:100%;padding:15px;font-size:16px;margin-top:6px}
button.btn:disabled{opacity:.5}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item .name{font-weight:600}
.small{font-size:13px;color:var(--muted)}
.tiny{font-size:12px;color:var(--muted)}
.price{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.warn{color:var(--warn)}
.err{color:var(--red)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--soft);color:var(--green);margin-right:4px}
.pill.w{background:var(--warnbg);color:var(--warn)}
.stop{border-left:4px solid var(--green2)}
.stopnum{width:30px;height:30px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
@media (prefers-color-scheme: dark){.stopnum{color:#0b1a10}}
.done .name{text-decoration:line-through;color:var(--muted)}
.total{font-size:22px;font-weight:800}
.alts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.alts span{font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.alts span.sel{border-color:var(--green2);color:var(--green);font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:85vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 14px calc(env(safe-area-inset-bottom) + 16px)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 80px);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;z-index:30;max-width:90%}
.empty{text-align:center;color:var(--muted);padding:20px 8px}
table.rev{width:100%;border-collapse:collapse;font-size:13px}
table.rev td{padding:4px 3px;border-top:1px solid var(--line);vertical-align:top}
table.rev input,table.rev select{padding:6px;font-size:13px;border-radius:7px}
label.lbl{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s 0.8s linear infinite;vertical-align:-3px}
@keyframes s{to{transform:rotate(360deg)}}
a.btn{display:block;text-align:center;text-decoration:none}
</style>
</head>
<body>
<header><h1 id="title">Handleliste</h1><span id="demoBadge" class="badge" hidden>DEMO</span></header>
<main id="main"></main>
<nav id="nav">
  <button data-v="liste"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>Liste</button>
  <button data-v="tilbud"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>Tilbud</button>
  <button data-v="tur"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h7a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h7"/></svg>Handletur</button>
  <button data-v="profil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Profil</button>
</nav>
<div id="modalRoot"></div>

<script>
"use strict";
/* ================= Grunndata ================= */
const CHAINS = {
  rema:'Rema 1000', kiwi:'Kiwi', meny:'Meny', spar:'Spar', joker:'Joker',
  extra:'Coop Extra', prix:'Coop Prix', mega:'Coop Mega', obs:'Obs', marked:'Coop Marked', bunnpris:'Bunnpris'
};
// Hvilke kjeder hvert kundeprogram gjelder i. Bonusprosent fyller du inn selv i Profil.
const PROGRAMS = {
  trumf:    {name:'Trumf', chains:['kiwi','meny','spar','joker']},
  kiwipluss:{name:'Kiwi Pluss', chains:['kiwi']},
  coop:     {name:'Coop medlem', chains:['extra','prix','mega','obs','marked']},
  ae:       {name:'Æ (Rema 1000)', chains:['rema']}
};
const STALE_DAYS = 14;
const PRICE_CACHE_H = 6;

function normChain(s){
  if(!s) return null; s = String(s).toLowerCase();
  if(s.includes('rema')) return 'rema';
  if(s.includes('kiwi')) return 'kiwi';
  if(s.includes('meny')) return 'meny';
  if(s.includes('joker')) return 'joker';
  if(s.includes('spar')) return 'spar';
  if(s.includes('extra')) return 'extra';
  if(s.includes('prix')) return 'prix';
  if(s.includes('mega')) return 'mega';
  if(s.includes('obs')) return 'obs';
  if(s.includes('marked')) return 'marked';
  if(s.includes('bunnpris')) return 'bunnpris';
  return null;
}

/* ================= Lagring ================= */
const KEY = 'handletur.v1';
const DEFAULT = {
  settings:{proxyUrl:'', appToken:'', radiusKm:5, maxStores:2, minSaving:30, returnHome:false, manualPos:'', demo:false,
            share:true, nick:'', sharedKm:25, deviceId:''},
  shared:{ts:0, offers:[]}, // tilbud fra andre i nærområdet
  sync:{code:'', lastChange:0, lastPush:0}, // profil i skyen
  memberships:{trumf:{on:false,bonus:0}, kiwipluss:{on:false,bonus:0}, coop:{on:false,bonus:0}, ae:{on:false,bonus:0}},
  personal:[],   // {id, program, keyword, pct}
  items:[],      // {id, name, qty, ean, productName}
  offers:[],     // {id, chain, name, price, condition, member(programKey|''), from, to, source}
  priceCache:{}, // ean -> {ts, prices:[{chain, price, date, name}]}
  trip:null
};
let applyingRemote = false, pushTimer = null, syncState = '';
let S = load();
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const o = JSON.parse(raw); return deepMerge(structuredClone(DEFAULT), o); }
  }catch(e){}
  const s = structuredClone(DEFAULT);
  // Ingen proxy satt opp ennå -> start i demo-modus så appen kan prøves
  s.settings.demo = true;
  return s;
}
function deepMerge(a,b){ for(const k in b){ if(b[k] && typeof b[k]==='object' && !Array.isArray(b[k]) && a[k] && typeof a[k]==='object' && !Array.isArray(a[k])) deepMerge(a[k],b[k]); else a[k]=b[k]; } return a; }
function save(silent=false){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  if(!silent && !applyingRemote){ S.sync.lastChange = Date.now(); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} schedulePush(); }
}
if(!S.settings.deviceId){ S.settings.deviceId = 'd'+uidLong(); save(); }
function uidLong(){ return Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>b.toString(16).padStart(2,'0')).join(''); }

/* ================= Profil i skyen ================= */
// Det som følger med profilen. Mellomtjeneste-URL, token og demo-modus er per telefon.
const LOCAL_ONLY = ['proxyUrl','appToken','isAdmin','demo'];
function syncEnabled(){ return !!(S.sync.code && !S.settings.demo && S.settings.proxyUrl && S.settings.appToken); }
function newProfileCode(){
  const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', b = crypto.getRandomValues(new Uint8Array(20));
  return Array.from(b, x=>abc[x % abc.length]).join('').match(/.{4}/g).join('-');
}
function profilePayload(){
  const settings = {...S.settings}; LOCAL_ONLY.forEach(k=>delete settings[k]);
  return {settings, memberships:S.memberships, personal:S.personal, items:S.items, offers:S.offers, trip:S.trip};
}
function applyProfile(d, ts){
  applyingRemote = true;
  const keep = Object.fromEntries(LOCAL_ONLY.map(k=>[k,S.settings[k]]));
  S.settings = {...structuredClone(DEFAULT.settings), ...(d.settings||{}), ...keep};
  for(const k of ['memberships','personal','items','offers','trip']) if(k in d) S[k] = k==='memberships' ? deepMerge(structuredClone(DEFAULT.memberships), d[k]||{}) : d[k];
  S.sync.lastChange = S.sync.lastPush = ts;
  save(true); applyingRemote = false;
}
function schedulePush(){
  if(!syncEnabled()) return;
  clearTimeout(pushTimer); pushTimer = setTimeout(pushProfile, 1500);
}
async function pushProfile(){
  if(!syncEnabled()) return;
  const ts = S.sync.lastChange || Date.now();
  try{
    syncState = 'lagrer';
    const r = await api('/profile/put', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({code:S.sync.code, data:profilePayload(), updated_at:ts})});
    S.sync.lastPush = r.updated_at || ts; syncState = 'ok'; save(true);
  }catch(e){ syncState = 'feil: '+e.message; }
  if(view==='profil') updateSyncStatus();
}
// Henter profilen. Er den i skyen nyere enn det som er endret her, brukes den.
async function pullProfile(force=false){
  if(!syncEnabled()) return {found:false, applied:false};
  const r = await api('/profile/get', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({code:S.sync.code})});
  if(!r.data){ if(!force) await pushProfile(); return {found:false, applied:false}; }
  const localNewer = S.sync.lastChange > S.sync.lastPush && S.sync.lastChange > r.updated_at;
  if(force || (!localNewer && r.updated_at > S.sync.lastPush)){ applyProfile(r.data, r.updated_at); syncState='ok'; return {found:true, applied:true}; }
  if(localNewer) await pushProfile();
  syncState='ok'; return {found:true, applied:false};
}
function updateSyncStatus(){
  const el = document.getElementById('syncStatus'); if(!el) return;
  el.innerHTML = !syncEnabled() ? (S.sync.code ? '<span class="warn">Ikke tilkoblet – sjekk oppsett eller slå av demo-modus</span>' : '')
    : syncState.startsWith('feil') ? `<span class="err">${esc(syncState)}</span>`
    : syncState==='lagrer' ? '<span class="spin"></span> Lagrer…'
    : S.sync.lastPush ? '✓ Lagret i skyen '+new Date(S.sync.lastPush).toLocaleString('nb-NO',{dateStyle:'short',timeStyle:'short'}) : '';
}

/* ================= Hjelpere ================= */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kr = n => (n==null||isNaN(n)) ? '–' : n.toLocaleString('nb-NO',{minimumFractionDigits:2,maximumFractionDigits:2})+' kr';
const today = () => new Date().toISOString().slice(0,10);
const fmtDate = d => { if(!d) return ''; const x=new Date(d); return isNaN(x)?'':x.toLocaleDateString('nb-NO',{day:'2-digit',month:'2-digit'}); };
const daysOld = d => { if(!d) return null; const x=new Date(d); return isNaN(x)?null:Math.floor((Date.now()-x)/864e5); };
function toast(msg, ms=2600){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), ms); }
function haversine(a,b){ const R=6371, r=Math.PI/180; const dLat=(b.lat-a.lat)*r, dLng=(b.lng-a.lng)*r; const x=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLng/2)**2; return 2*R*Math.asin(Math.sqrt(x)); }
function tokens(s){ return String(s).toLowerCase().replace(/[^a-zæøå0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>=3); }
// Tolker mengde: "400 g", "1,5 kg", "3x200 g", "33 cl", "6 stk", "per kg" -> {amount, unit, per}
function parseQty(str){
  if(!str) return null;
  const t = String(str).toLowerCase().replace(',', '.').replace(/\s+/g,' ').trim();
  const per = t.match(/(?:^|\s)(?:per|pr\.?|\/)\s*(kg|hg|g|l|liter|dl|cl|ml|stk)\b/);
  if(per){ const u = per[1]; return {amount:1, unit: ['kg','hg','g'].includes(u)?'kg':(u==='stk'?'stk':'l'), per:true}; }
  const m = t.match(/(?:(\d+(?:\.\d+)?)\s*[x×]\s*)?(\d+(?:\.\d+)?)\s*(kg|hg|g|gram|liter|l|dl|cl|ml|stk|pk|pakning|bokser|bokser)\b/);
  if(!m) return null;
  const n = (m[1]?+m[1]:1) * +m[2], u = m[3];
  const conv = {kg:[1,'kg'], hg:[0.1,'kg'], g:[0.001,'kg'], gram:[0.001,'kg'], l:[1,'l'], liter:[1,'l'], dl:[0.1,'l'], cl:[0.01,'l'], ml:[0.001,'l'], stk:[1,'stk'], pk:[1,'stk'], pakning:[1,'stk'], bokser:[1,'stk']}[u];
  const amount = n*conv[0];
  return amount>0 ? {amount, unit:conv[1], per:false} : null;
}
function unitPrice(price, qtyStr){
  const q = parseQty(qtyStr); if(!q || price==null || isNaN(price)) return null;
  return {value: q.per ? +price : +price/q.amount, unit:q.unit};
}
const fmtUnit = u => u ? kr(u.value)+'/'+u.unit : '';
function hash(s){ let h=2166136261; for(const c of String(s)){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return (h>>>0); }

/* ================= API (via mellomtjenesten) ================= */
async function api(path, opts={}){
  const base = S.settings.proxyUrl.replace(/\/+$/,'');
  if(!base) throw new Error('Mellomtjeneste-URL mangler. Legg den inn under Profil → Oppsett.');
  const r = await fetch(base+path, {...opts, headers:{'x-app-token':S.settings.appToken, ...(opts.headers||{})}});
  const txt = await r.text();
  let j; try{ j = JSON.parse(txt); }catch(e){ throw new Error('Uventet svar ('+r.status+')'); }
  if(!r.ok) throw new Error(j.error || j.message || ('Feil '+r.status));
  return j;
}
async function searchProducts(q){
  if(S.settings.demo) return demoSearch(q);
  const j = await api('/kassal/products?search='+encodeURIComponent(q)+'&size=60');
  return (j.data||[]).map(p=>({
    name:p.name, brand:p.brand, ean:p.ean, image:p.image||'',
    weight: p.weight ? (p.weight+' '+(p.weight_unit||'')) : '',
    chain: normChain(p.store?.code||p.store?.name),
    price: typeof p.current_price==='object' ? p.current_price?.price : p.current_price,
    unitPrice: typeof p.current_unit_price==='object' ? p.current_unit_price?.price : p.current_unit_price,
    unit: p.weight_unit==='kg'||p.weight_unit==='g' ? 'kg' : (p.weight_unit==='l'||p.weight_unit==='ml' ? 'l' : '')
  })).filter(p=>p.ean);
}
// Slår sammen samme produkt (EAN) fra flere kjeder og rangerer: best treff først, så lavest kilo-/literpris
function rankProducts(res, q){
  const by = new Map();
  for(const p of res){
    const g = by.get(p.ean) || {...p, minPrice:null, minUnit:null, chains:new Set(), cheapChain:null};
    if(p.chain) g.chains.add(p.chain);
    if(p.price!=null && (g.minPrice==null || +p.price < g.minPrice)){ g.minPrice = +p.price; g.cheapChain = p.chain; }
    if(p.unitPrice!=null && (g.minUnit==null || +p.unitPrice < g.minUnit)) g.minUnit = +p.unitPrice;
    if(!g.image && p.image) g.image = p.image;
    by.set(p.ean, g);
  }
  const words = tokens(q);
  const score = g => { const n = String(g.name).toLowerCase(); return words.filter(w=>n.includes(w)).length; };
  return [...by.values()].sort((a,b)=>
    score(b)-score(a) ||
    ((a.minUnit??1e9) - (b.minUnit??1e9)) ||
    ((a.minPrice??1e9) - (b.minPrice??1e9)));
}
async function pricesForEan(ean){
  const c = S.priceCache[ean];
  if(c && Date.now()-c.ts < PRICE_CACHE_H*3600e3) return c.prices;
  let prices;
  if(S.settings.demo || String(ean).startsWith('demo-')) prices = demoPrices(ean);
  else{
    const j = await api('/kassal/products/ean/'+encodeURIComponent(ean));
    const prods = j.data?.products || [];
    const best = {};
    for(const p of prods){
      const chain = normChain(p.store?.code || p.store?.name); if(!chain) continue;
      const price = typeof p.current_price==='object' ? p.current_price?.price : p.current_price;
      const date = (typeof p.current_price==='object' && p.current_price?.date) || p.updated_at || null;
      if(price==null) continue;
      if(!best[chain] || price < best[chain].price) best[chain] = {chain, price:+price, date, name:p.name};
    }
    prices = Object.values(best);
  }
  S.priceCache[ean] = {ts:Date.now(), prices}; save(true);
  return prices;
}
async function nearbyStores(origin){
  if(S.settings.demo) return demoStores();
  const j = await api(`/kassal/physical-stores?lat=${origin.lat}&lng=${origin.lng}&km=${S.settings.radiusKm}&size=100`);
  return (j.data||[]).map(s=>({
    chain: normChain(s.group || s.name),
    name: s.name, address: s.address || '',
    lat: +(s.position?.lat ?? s.lat), lng: +(s.position?.lng ?? s.lng)
  })).filter(s=>s.chain && !isNaN(s.lat) && !isNaN(s.lng));
}
/* ---- Delte tilbud ---- */
let demoShared = null;
function mapShared(o){ return {id:'r'+o.id, remoteId:o.id, chain:o.chain, name:o.name, price:+o.price, qty:o.qty||'', condition:o.condition||'', member:o.member||'',
  from:o.valid_from||'', to:o.valid_to||'', source:'delt', confirms:o.confirms||0, reports:o.reports||0, nick:o.nick||'', mine:!!o.mine, created:o.created_at}; }
async function syncShared(origin, force=false){
  if(!force && Date.now()-S.shared.ts < 10*60e3) return;
  let list;
  if(S.settings.demo){
    demoShared ||= [
      {id:9001, chain:'rema', name:'Grandiosa Original', qty:'575 g', price:39.9, condition:'', member:'', valid_from:today(), valid_to:new Date(Date.now()+3*864e5).toISOString().slice(0,10), nick:'Kari', confirms:4, reports:0},
      {id:9002, chain:'extra', name:'Tine Lettmelk 1 l', price:19.9, condition:'maks 4', member:'coop', valid_from:today(), valid_to:new Date(Date.now()+2*864e5).toISOString().slice(0,10), nick:'', confirms:1, reports:0},
      {id:9003, chain:'meny', name:'Bananer', qty:'per kg', price:17.9, condition:'', member:'', valid_from:today(), valid_to:'', nick:'Ole', confirms:0, reports:1}
    ];
    list = demoShared;
  } else {
    origin ||= await getOrigin();
    const j = await api(`/offers?lat=${origin.lat}&lng=${origin.lng}&km=${S.settings.sharedKm}&device=${S.settings.deviceId}`);
    list = j.offers || [];
  }
  S.shared = {ts:Date.now(), offers:list.map(mapShared)}; save(true);
}
async function shareOffers(newOffers){
  if(!S.settings.share || !newOffers.length) return;
  if(S.settings.demo){ newOffers.forEach((o,i)=>o.remoteId = 8000+i+Math.floor(Math.random()*999)); save(); return; }
  try{
    const origin = await getOrigin();

/* ================= Beregning ================= */
function offerValid(o){ const t=today(); return (!o.from || o.from<=t) && (!o.to || o.to>=t); }
function offerMatches(o, item){
  if(o.ean && item.ean && o.ean===item.ean) return true;
  const it = tokens(item.productName || item.name); if(!it.length) return false;
  const on = String(o.name).toLowerCase();
  // treff hvis alle ord i varenavnet på listen finnes i tilbudsteksten
  const core = tokens(item.name);
  return (core.length ? core : it).every(w => on.includes(w));
}
function memberBonus(chain){
  let best = 0;
  for(const [k,p] of Object.entries(PROGRAMS)){
    const m = S.memberships[k]; if(m?.on && p.chains.includes(chain)) best = Math.max(best, +m.bonus||0);
  }
  return best;
}
function personalPct(chain, item){
  let pct = 0; const nm = (item.productName||item.name).toLowerCase();
  for(const r of S.personal){
    if(!S.memberships[r.program]?.on) continue;
    if(!PROGRAMS[r.program].chains.includes(chain)) continue;
    if(r.keyword && nm.includes(r.keyword.toLowerCase())) pct = Math.max(pct, +r.pct||0);
  }
  return pct;
}
async function candidatesFor(item){
  const cand = {}; // chain -> {base, eff, source, date, note}
  if(item.ean){
    try{
      for(const p of await pricesForEan(item.ean)) cand[p.chain] = {base:p.price, source:'Kassalapp', date:p.date, note:''};
    }catch(e){ console.warn(e); }
  }
  for(const o of allOffers()){
    if(!offerValid(o) || !offerMatches(o,item)) continue;
    if(o.member && !S.memberships[o.member]?.on) continue;
    const cur = cand[o.chain];
    if(!cur || o.price < cur.base) cand[o.chain] = {base:+o.price, source:o.source==='delt'?'Delt tilbud':'Tilbud', date:null, note:[o.condition, o.member?('kun '+PROGRAMS[o.member].name):'', o.to?('t.o.m. '+fmtDate(o.to)):''].filter(Boolean).join(' · '), offerName:o.name, qty:o.qty||''};
  }
  for(const [chain,c] of Object.entries(cand)){
    const bonus = memberBonus(chain), pers = personalPct(chain,item);
    c.eff = c.base * (1-pers/100) * (1-bonus/100);
    c.disc = [pers?('-'+pers+' % personlig'):'', bonus?('-'+bonus+' % bonus'):''].filter(Boolean).join(', ');
  }
  return cand;
}
function* combos(arr,k,start=0,acc=[]){
  if(acc.length===k){ yield acc.slice(); return; }
  for(let i=start;i<arr.length;i++){ acc.push(arr[i]); yield* combos(arr,k,i+1,acc); acc.pop(); }
}
function evalSubset(sub, rows){
  let cost=0, missing=0; const pick=[];
  for(const r of rows){
    let best=null;
    for(const c of sub){ const x=r.cand[c]; if(x && (!best || x.eff<best.eff)) best={chain:c,...x}; }
    if(best){ cost += best.eff*r.item.qty; pick.push({item:r.item, ...best}); } else if(Object.keys(r.cand).length) missing++;
  }
  return {sub, cost, missing, pick};
}
function bestRoute(origin, chosen, stores){
  // For hver kjede: de 3 nærmeste butikkene. Prøv alle kombinasjoner og rekkefølger.
  const opts = chosen.map(c => stores.filter(s=>s.chain===c).sort((a,b)=>haversine(origin,a)-haversine(origin,b)).slice(0,3));
  let best=null;
  const perms = a => a.length<=1 ? [a] : a.flatMap((x,i)=>perms([...a.slice(0,i),...a.slice(i+1)]).map(p=>[x,...p]));
  const pick = (i,acc) => {
    if(i===opts.length){
      for(const order of perms(acc)){
        let d=0, prev=origin; for(const s of order){ d+=haversine(prev,s); prev=s; }
        if(S.settings.returnHome) d+=haversine(prev,origin);
        if(!best || d<best.d) best={d, order};
      }
      return;
    }
    for(const s of opts[i]) pick(i+1,[...acc,s]);
  };
  pick(0,[]);
  return best;
}
function getOrigin(){
  if(S.settings.demo) return Promise.resolve(DEMO_ORIGIN);
  const m = S.settings.manualPos.match(/(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)/);
  return new Promise((res,rej)=>{
    const fallback = () => m ? res({lat:+m[1], lng:+m[2]}) : rej(new Error('Fikk ikke posisjon. Tillat posisjon, eller legg inn fast posisjon under Profil → Oppsett.'));
    if(!navigator.geolocation) return fallback();
    navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude, lng:p.coords.longitude}), fallback, {timeout:10000, maximumAge:300000});
  });
}
async function planTrip(){
  const items = S.items.filter(i=>!i.done);
  if(!items.length) throw new Error('Handlelisten er tom.');
  const origin = await getOrigin();
  try{ await syncShared(origin); }catch(e){ console.warn('Delte tilbud:', e); }
  const stores = await nearbyStores(origin);
  if(!stores.length) throw new Error('Fant ingen kjente butikker innen '+S.settings.radiusKm+' km. Øk radiusen under Profil.');
  const nearChains = [...new Set(stores.map(s=>s.chain))];
  const rows = [];
  for(const item of items) rows.push({item, cand: Object.fromEntries(Object.entries(await candidatesFor(item)).filter(([c])=>nearChains.includes(c)))});
  const usable = nearChains.filter(c => rows.some(r=>r.cand[c]));
  const noPrice = rows.filter(r=>!Object.keys(r.cand).length).map(r=>r.item);
  if(!usable.length) throw new Error('Ingen av varene har pris i butikkene i nærheten. Koble varene til produkter (trykk «Finn pris») eller legg inn tilbud.');
  const maxK = Math.min(S.settings.maxStores, usable.length, 5);
  const bestByK = [];
  for(let k=1;k<=maxK;k++){
    let best=null;
    for(const sub of combos(usable,k)){
      const r = evalSubset(sub, rows);
      if(!best || r.missing<best.missing || (r.missing===best.missing && r.cost<best.cost)) best=r;
    }
    bestByK.push(best);
  }
  let chosen = bestByK[0];
  for(const b of bestByK.slice(1)){
    if(b.missing < chosen.missing || chosen.cost - b.cost >= S.settings.minSaving) chosen = b;
  }
  // Bygg en ferdig rute for hvert alternativ (1, 2, 3 … butikker), så du kan bytte mellom dem
  const variants = bestByK.map((b,i) => buildVariant(b, i+1, origin, stores, rows));
  S.trip = {created:Date.now(), origin, variants, noPrice: noPrice.map(i=>i.name)};
  selectVariant(bestByK.indexOf(chosen), true);
  save();
}
function buildVariant(b, k, origin, stores, rows){
  const usedChains = [...new Set(b.pick.map(p=>p.chain))];
  const route = bestRoute(origin, usedChains, stores);
  const stops = route.order.map(st => ({
    store: st, chain: st.chain, dist: haversine(origin, st),
    items: b.pick.filter(p=>p.chain===st.chain).map(p=>({
      itemId:p.item.id, name:p.item.productName||p.item.name, qty:p.item.qty, unit:p.eff, base:p.base, total:p.eff*p.item.qty,
      source:p.source, date:p.date, note:p.note, disc:p.disc, offerName:p.offerName, unitTxt:fmtUnit(unitPrice(p.eff, p.qty)), done:false
    }))
  }));
  const pts = route.order.map(s=>s.lat+','+s.lng);
  const dest = S.settings.returnHome ? origin.lat+','+origin.lng : pts[pts.length-1];
  const wps = S.settings.returnHome ? pts : pts.slice(0,-1);
  const mapsUrl = 'https://www.google.com/maps/dir/?api=1&travelmode=driving&origin='+origin.lat+','+origin.lng+'&destination='+dest+(wps.length?'&waypoints='+encodeURIComponent(wps.join('|')):'');
  const missing = rows.filter(r=>Object.keys(r.cand).length && !b.pick.some(p=>p.item.id===r.item.id)).map(r=>r.item.name);
  return {k, cost:b.cost, missingCount:b.missing, total:b.cost, km:route.d, stops, mapsUrl, missing};
}
// Bytt hvilket alternativ som vises. Avkryssinger beholdes for varer du allerede har tatt.
function selectVariant(i, auto=false){
  const T = S.trip, V = T.variants[i]; if(!V) return;
  const done = new Set((T.stops||[]).flatMap(s=>s.items.filter(x=>x.done).map(x=>x.itemId)));
  V.stops.forEach(s=>s.items.forEach(x=>{ if(done.has(x.itemId)) x.done = true; }));
  Object.assign(T, {sel:i, total:V.total, km:V.km, stops:V.stops, mapsUrl:V.mapsUrl, missing:V.missing});
  if(auto) T.recommended = i;
  T.alternatives = T.variants.map((v,j)=>({k:v.k, cost:v.cost, missing:v.missingCount, chosen:j===i, rec:j===T.recommended}));
}

function readB64(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]); r.onerror=rej; r.readAsDataURL(file); }); }
async function shrinkImage(file){
  // Skaler ned store bilder til maks 1600 px for å holde forespørselen liten
  try{
    const bmp = await createImageBitmap(file);
    const s = Math.min(1, 1600/Math.max(bmp.width,bmp.height));
    const c = document.createElement('canvas'); c.width=Math.round(bmp.width*s); c.height=Math.round(bmp.height*s);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    return c.toDataURL('image/jpeg',0.85).split(',')[1];
  }catch(e){ return readB64(file); }
}

function bTilbud(){
  if($('#impBtn')) $('#impBtn').onclick = async () => {
    const files = [...$('#impFiles').files], st = $('#impStatus'), chainHint = $('#impChain').value;
    if(!files.length && !S.settings.demo){ st.textContent='Velg en PDF eller bilder først.'; return; }
    const btn = $('#impBtn'); btn.disabled = true;
    st.innerHTML = '<span class="spin"></span> Leser kundeavisen… (kan ta opptil et minutt)';
    try{
      const payload = [];
      for(const f of files){
        if(f.type==='application/pdf'){
          if(f.size > 30e6) throw new Error(f.name+' er for stor (maks 30 MB).');
          payload.push({type:'pdf', media_type:'application/pdf', data: await readB64(f)});
        } else payload.push({type:'image', media_type:'image/jpeg', data: await shrinkImage(f)});
      }
      const res = await parseFlyer(payload, chainHint);
      const chain = normChain(res.kjede) || chainHint || 'kiwi';
      pendingImport = (res.tilbud||[]).map(t=>({
        keep:true, chain, name:[t.merke, t.vare].filter(Boolean).join(' '), qty: t.mengde||'',
        price: t.pris, condition: t.betingelse||'', member: t.kun_medlem ? (Object.keys(PROGRAMS).find(k=>PROGRAMS[k].chains.includes(chain))||'') : '',
        from: res.gyldig_fra||'', to: res.gyldig_til||''
      })).filter(t=>t.price!=null && !isNaN(+t.price));
      st.textContent = '';
      openReview();
    }catch(e){ st.innerHTML = `<span class="err">${esc(e.message)}</span>`; }
    btn.disabled = false;
  };
  $('#offForm').onsubmit = e => {
    e.preventDefault();
    const o = {id:uid(), chain:$('#offChain').value, name:$('#offName').value.trim(), price:+$('#offPrice').value,
      qty:$('#offQty').value.trim(), condition:$('#offCond').value.trim(), member:$('#offMember').value, from:today(), to:$('#offTo').value||'', source:'manuell'};
    S.offers.push(o); save(); toast('Tilbud lagret'); render();
    shareOffers([o]);
  };
  const upd = () => { const u = unitPrice(+$('#offPrice').value || null, $('#offQty').value || $('#offName').value); $('#offUnit').textContent = u ? '= '+fmtUnit(u) : ''; };
  ['#offQty','#offPrice','#offName'].forEach(id=>$(id).addEventListener('input', upd));
  document.querySelectorAll('.odel').forEach(el=>el.onclick=()=>{
    const o = S.offers.find(x=>x.id===el.dataset.id); if(o?.remoteId) deleteShared(o.remoteId);
    S.offers=S.offers.filter(x=>x.id!==el.dataset.id); save(); render();
  });
  document.querySelectorAll('.vote').forEach(el=>el.onclick=async()=>{
    try{ await voteShared(+el.dataset.id, el.dataset.k); render(); }catch(e){ toast(e.message); }
  });
  $('#shRefresh').onclick = async () => {
    $('#shRefresh').innerHTML='<span class="spin"></span>';
    try{ await syncShared(null, true); }catch(e){ toast(e.message, 4500); }
    if(view==='tilbud') render();
  };
  if(S.settings.share && Date.now()-S.shared.ts > 10*60e3 && (S.settings.demo || S.settings.proxyUrl)){
    syncShared().then(()=>{ if(view==='tilbud' && !$('#modalRoot').innerHTML) render(); }).catch(()=>{});
  }
  const p = $('#purge'); if(p) p.onclick = () => { S.offers = S.offers.filter(offerValid); save(); render(); };
}

  on('#pcOut', () => {
    modal(`<h2 style="margin:0 0 8px">Koble fra profilen?</h2>
      <p class="small">Dataene blir liggende på denne telefonen og i skyen. Du kan hente dem igjen med koden:</p>
      <p style="font-family:ui-monospace,monospace">${esc(S.sync.code)}</p>
      <button id="pcOutYes" class="btn big">Koble fra</button><button id="pcOutNo" class="btn ghost" style="width:100%">Avbryt</button>`);
    $('#pcOutYes').onclick = () => { S.sync = {code:'', lastChange:0, lastPush:0}; save(true); closeModal(); render(); };
    $('#pcOutNo').onclick = closeModal;
  });
  document.querySelectorAll('.mOn').forEach(el=>el.onchange=()=>{ S.memberships[el.dataset.k].on=el.checked; save(); });
  document.querySelectorAll('.mBonus').forEach(el=>el.onchange=()=>{ S.memberships[el.dataset.k].bonus=Math.max(0,+el.value||0); save(); });
  document.querySelectorAll('.pdel').forEach(el=>el.onclick=()=>{ S.personal=S.personal.filter(r=>r.id!==el.dataset.id); save(); render(); });
  $('#pForm').onsubmit = e => { e.preventDefault(); S.personal.push({id:uid(), program:$('#pProg').value, keyword:$('#pKey').value.trim(), pct:+$('#pPct').value}); save(); render(); };
  const bind = (id, key, fn=v=>v) => { $(id).onchange = () => { st[key] = fn($(id).type==='checkbox' ? $(id).checked : $(id).value); save(); if(['#sDemo','#sUrl','#sTok'].includes(id)) render(); }; };
  bind('#sMax','maxStores',v=>Math.min(5,Math.max(1,+v||1)));
  bind('#sMin','minSaving',v=>Math.max(0,+v||0));
  bind('#sRad','radiusKm',v=>Math.min(50,Math.max(1,+v||5)));
  bind('#sRet','returnHome'); bind('#sSug','suggest'); bind('#sPos','manualPos', v=>v.trim()); bind('#sDemo','demo');
  bind('#sUrl','proxyUrl', v=>v.trim()); bind('#sTok','appToken', v=>v.trim());
  $('#sUrl').addEventListener('change', ()=>checkRole().catch(()=>{}));
  $('#sDemo').addEventListener('change', ()=>checkRole().catch(()=>{}));
  $('#sTok').addEventListener('change', ()=>checkRole().catch(()=>{}));
  bind('#sShare','share'); bind('#sNick','nick', v=>v.trim().slice(0,30));
  bind('#sShKm','sharedKm', v=>{ S.shared.ts=0; return Math.min(100,Math.max(1,+v||25)); });
  $('#sTest').onclick = async () => {
    const out = $('#sTestRes'); out.innerHTML = '<span class="spin"></span>';
    try{ const j = await checkRole(); if(!j) throw new Error('Slå av demo-modus og fyll inn URL og token først.'); out.innerHTML = `✓ Tilkoblet. Kassalapp-nøkkel: ${j.kassal?'OK':'<span class="err">mangler</span>'} · AI-nøkkel: ${j.ai?'OK':'<span class="err">mangler</span>'} · Delingsdatabase: ${j.db?'OK':'<span class="err">mangler</span>'} · Kundeavis-tolkning: ${j.admin?'tilgjengelig':'bare for administrator'}`; }
    catch(e){ out.innerHTML = `<span class="err">${esc(e.message)}</span>`; }
  };
  $('#bkCopy').onclick = async () => {
    const data = JSON.stringify({...S, priceCache:{}}); $('#bkTxt').value = data;
    try{ await navigator.clipboard.writeText(data); toast('Kopiert'); }catch(e){ $('#bkTxt').select(); toast('Merk og kopier teksten'); }
  };
  $('#bkLoad').onclick = () => {
    try{ const o = JSON.parse($('#bkTxt').value); S = deepMerge(structuredClone(DEFAULT), o); save(); toast('Data lastet inn'); render(); }
    catch(e){ toast('Ugyldig sikkerhetskopi'); }
  };
  $('#clearPrices').onclick = () => { S.priceCache = {}; save(true); toast('Prismellomlager tømt'); };
}

/* ---- Modal ---- */
function modal(html){
  $('#modalRoot').innerHTML = `<div class="modal" id="mBg"><div class="sheet">${html}</div></div>`;
  $('#mBg').onclick = e => { if(e.target.id==='mBg') closeModal(); };
}
function closeModal(){ $('#modalRoot').innerHTML=''; }

/* ---- Start ---- */
render();
checkRole().then(()=>{ if(view==='tilbud') render(); }).catch(()=>{});
// Hent siste versjon av profilen ved oppstart og når appen åpnes igjen
const refreshProfile = () => pullProfile().then(r=>{ if(r.applied && !$('#modalRoot').innerHTML) render(); }).catch(()=>{});
refreshProfile();
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') refreshProfile(); else if(S.sync.lastChange > S.sync.lastPush) pushProfile(); });
try{ if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){}
</script>
</body>
</html>
